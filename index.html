<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Advanced Variant Management with Sphinx-Needs</title>

  <link rel="stylesheet" href="reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="css/marquardt.css" />
  <link rel="stylesheet" href="css/custom.css" />

  <!-- Theme used for syntax highlighted code -->
  <link rel="stylesheet" href="reveal.js/dist/plugin/highlight/monokai.css" />
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="index.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$">
      </section>
    </div>
  </div>

  <script src="reveal.js/dist/reveal.js"></script>
  <script src="reveal.js/dist/plugin/notes.js"></script>
  <script src="reveal.js/dist/plugin/markdown.js"></script>
  <script src="reveal.js/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.4.1/plugin/mermaid/mermaid.min.js"></script>
  <script>
    // The Markdown plugin gives the class of an `.element` comment to the element in
    // front of the comment. At the end of a line with inline code or a link, that is
    // the code or the link, so only that part waits for the click. This plugin runs
    // after the Markdown plugin and moves such a fragment class to its line.
    const FragmentToLine = {
      id: "fragment-to-line",
      init: (deck) => {
        const inline = ["CODE", "A", "EM", "STRONG", "SPAN"];
        deck.getRevealElement().querySelectorAll("li > .fragment, p > .fragment").forEach((element) => {
          if (inline.includes(element.tagName)) {
            element.classList.remove("fragment");
            element.parentElement.classList.add("fragment");
          }
        });
      },
    };

    // More info about initialization & config:
    // - https://revealjs.com/initialization/
    // - https://revealjs.com/config/
    Reveal.initialize({
      hash: true,
      slideNumber: "h.v",
      pdfSeparateFragments: false,
      pdfMaxPagesPerSlide: 1,
      backgroundTransition: "slide",
      // Learn about plugins: https://revealjs.com/plugins/
      // FragmentToLine must come right after RevealMarkdown: it works on the slides
      // that the Markdown plugin has made.
      plugins: [RevealMarkdown, FragmentToLine, RevealHighlight, RevealNotes, RevealMermaid],
    });
  </script>
</body>

</html>
